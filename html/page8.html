<!DOCTYPE html>
<html lang = "vi">
       <head>
                 <title>Thiết kế trang giới thiệu sản phẩm</title>
                 <meta charset = "utf-8">
            <!-- Latest compiled and minified CSS -->
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

            <!-- Latest compiled JavaScript -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

			<link rel = "stylesheet" href = "../css/style.css">	
       </head>
       <body>
             <div class = "container">	
                  <div id = "product-list">	
                        <!--Chứa danh sách các sản phẩm-->
                  </div>
            </div>
            <script>
                  //Xác định khung chứa product-list
                  const listProduct = document.getElementById("product-list");//Tác động đén thẻ <div> có id ="product-list"

                  //Tại 1 container có class ="item"
                  const item = document.createElement("div");//<div></div>
                  item.setAttribute("class", "item");//<div class = "item"></div>

                  //Tạo 2 khung chứa Hình ảnh và Thông tin
                  //Tạo 1 container chứa hình ảnh có class ="item" ==> chỉ có 1 con là <img>
                  const containerImage = document.createElement("div"); //<div></div>
                  containerImage.setAttribute("class", "image");//<div class = "image"></div>

                  //Tạo ảnh
                  const img = document.createElement("img");
                  img.setAttribute("src","../assets/images/rose.webp");
                  img.setAttribute("alt", "Hoa hồng Pháp");
                  img.setAttribute("style","width:100%; max-width:150px");

                  //Đưa vào khung chứa ảnh
                  containerImage.appendChild(img);

                  //Tạo 1 container chứa thông tin sản phẩm có class = "info" ==> có 3 <p> và 1 <a>
                  const containerInfor = document.createElement("div");//<div></div>
                  containerInfor.setAttribute("class", "info");//<div class = "info"></div>
                  
                  //Tạo <p> chứa tên sản phẩm
                  const nameProduct = document.createElement("p");
                  nameProduct.innerHTML = "Hạt giống hoa Hồng";

                  //Tạo <p> chứa giá sản phẩm
                  const price = document.createElement("p");
                  price.innerHTML = "250k/túi";

                  //Tạo <p> chứa mô tả sản phẩm
                  const description = document.createElement("p");
                  description.innerHTML ="Đây là một loại hoa hồng nổi tiếng ở nước Pháp được nhập khẩu vào Việt Nam .... thích với điều kiện khí hậu nhiệt đới";

                  //Tạo <a> chứa liên kết
                  const linkProduct = document.createElement("a");
                  linkProduct.innerHTML = "Xem chi tiết";
                  linkProduct.setAttribute("href", "page8.html");

                  //Đưa các thông tin vào containerInfor
                  containerInfor.appendChild(nameProduct);
                  containerInfor.appendChild(price);
                  containerInfor.appendChild(description);
                  containerInfor.appendChild(linkProduct);

                  //Đưa image + info vào itme
                  item.appendChild(containerImage);
                  item.appendChild(containerInfor);
                 

                  //Đưa item vào product-list
                  listProduct.appendChild(item);

            </script>

      </body>
</html>
