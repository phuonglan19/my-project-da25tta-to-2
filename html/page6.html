<!DOCTYPE html>
<html lang = "vi">
        <head>
                 <title>Tính diện tich hình chữ nhật</title>
                 <meta charset = "utf-8">
				
       </head>
       <body>
            
             <script> 
				let d = Number (prompt ("Hãy nhập chiều dài hình chữ nhật:"));
				
				let r = Number (prompt ("Hãy nhập chiều rộng hình chữ nhật:"));
				
				if(d<r)
				alert ("Chiều dài phải nhỏ hơn chiều rộng");
						else if(d==r)
				alert ("TRƯỜNG HỢP ĐẶC BIỆT :DIỆN TÍCH HÌNH VUÔNG LÀ: "+d*r);
						else 
				alert ("DIỆN TÍCH HÌNH CHỮ NHẬT LÀ: " +d*r);
            </script>  				
       </body>
</html>
